<script>/* AZ / 02 — visual progress ring adapter.
   The Rhye template is the single source of truth for loading percent and dismissal.
   This script never simulates progress and never removes/hides the native preloader. */
(function () {
  'use strict';
  var loader = document.getElementById('js-preloader');
  if (!loader || !loader.classList.contains('az-preloader--ring')) return;

  var counter = loader.querySelector('.preloader__counter-current');
  var ring = loader.querySelector('.az-preloader__ring-fill');
  var head = loader.querySelector('.az-preloader__ring-head');
  if (!counter || !ring) return;

  function updateFromNativeCounter() {
    var text = counter.textContent || '0';
    var parsed = parseFloat(text.replace(/[^0-9.]/g, ''));
    var percent = Number.isFinite(parsed) ? Math.max(0, Math.min(100, parsed)) : 0;
    ring.style.strokeDashoffset = String(100 - percent);
    loader.style.setProperty('--az-progress', String(percent));
    if (head) head.style.opacity = percent > 0 ? '1' : '0';
    loader.classList.toggle('az-preloader--complete', percent >= 100);
  }

  updateFromNativeCounter();
  var observer = new MutationObserver(updateFromNativeCounter);
  observer.observe(counter, { childList: true, characterData: true, subtree: true });
  // Disconnect automatically after Rhye removes the loader.
  var rootObserver = new MutationObserver(function () {
    if (!loader.isConnected) {
      observer.disconnect();
      rootObserver.disconnect();
    }
  });
  rootObserver.observe(document.body, { childList: true, subtree: true });
})();
</script>
<script>
(function () {
 var counter=document.querySelector('.preloader__counter-current');
 var started=0, frame=0, duration=5500;
 function tick(now) {
   if(!started) started=now;
   var t=Math.min(1,(now-started)/duration);
   // Variable paced demo progression, ending at exactly 100.
   var p=t < .76 ? 88 * (1-Math.pow(1-t/.76,2.4)) : 88+12*(t-.76)/.24;
   counter.textContent=String(Math.round(Math.min(100,p)));
   if(t < 1) frame=requestAnimationFrame(tick);
 }
 function restart() {
  cancelAnimationFrame(frame); started=0; counter.textContent='0';
  document.querySelector('.az-preloader__disc').style.animation='none';
  document.querySelector('.az-preloader__disc').offsetHeight;
  document.querySelector('.az-preloader__disc').style.animation='';
  frame=requestAnimationFrame(tick);
 }
 document.getElementById('replay').addEventListener('click',restart);
 if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) { counter.textContent='100'; }
 else { frame=requestAnimationFrame(tick); }
})();
</script></body></html>
